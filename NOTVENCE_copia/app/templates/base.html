<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NotVence</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', path='css/style.css') }}?v=20260820">
</head>
<body>
<div class="app-shell">
    <header class="topbar">
        <a class="brand" href="/inventario" aria-label="Inicio NotVence">
            <img src="{{ url_for('static', path='img/notvence-logo.png') }}" alt="Logo NotVence">
            <span>NotVence</span>
        </a>

        <nav class="topnav" aria-label="Navegación principal">
            <a class="{% if current_page == 'inventario' %}active{% endif %}" href="/inventario">Inventario</a>
            <a class="{% if current_page == 'producto' %}active{% endif %}" href="/producto/nuevo">Registrar</a>
            <a class="{% if current_page == 'alertas' %}active{% endif %}" href="/alertas">Alertas</a>
        </nav>

        <div class="topbar-actions">
            <label class="search-box">
                <span>⌕</span>
                <input id="globalSearch" type="search" placeholder="Buscar o ir a...">
            </label>
            <a class="signin-link" data-confirm-logout href="/logout">Cerrar sesión</a>
        </div>
    </header>

    <main class="page-content">
        {% block content %}{% endblock %}
    </main>
</div>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast text-bg-dark border-light" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body" id="appToastMessage">Acción realizada.</div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Cerrar"></button>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', path='js/app.js') }}?v=20260820"></script>
</body>
</html>
